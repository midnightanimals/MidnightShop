<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相簿</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display&display=swap" rel="stylesheet">

  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div id="header-placeholder"></div>

  <main>
    <div id="galleryRoot"></div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- 燈箱 -->
  <div id="galleryLightbox" role="dialog" aria-modal="true" aria-label="圖片燈箱">
    <button class="lb-close" aria-label="關閉">&times;</button>
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-nav lb-nav--prev" id="lbPrev" aria-label="上一張">
      <i class="fa fa-chevron-left"></i>
    </button>
    <button class="lb-nav lb-nav--next" id="lbNext" aria-label="下一張">
      <i class="fa fa-chevron-right"></i>
    </button>
    <div class="lb-img-wrap">
      <img id="lbImg" src="" alt="">
    </div>
    <div class="lb-footer">
      <p class="lb-caption" id="lbCaption"></p>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
